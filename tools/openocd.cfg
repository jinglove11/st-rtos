# OpenOCD 配置文件 for RP2350 (Pico 2)
# 使用 CMSIS-DAP 调试器

# 接口配置
source [find interface/cmsis-dap.cfg]

# 目标配置
source [find target/rp2350.cfg]

# 调试适配器速度
adapter speed 5000

# RP2350 没有 SRST 线 — 复位靠 SYSRESETREQ(via cortex_m reset_config),
# 已在 target/rp2350.cfg 内默认设置。这里不需要再覆盖 reset_config。

# 初始化
init

# Halt
halt
