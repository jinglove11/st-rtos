# OpenOCD 配置文件 for RP2350 (Pico 2)
# 使用 CMSIS-DAP 调试器

# 接口配置
source [find interface/cmsis-dap.cfg]

# 目标配置
source [find target/rp2350.cfg]

# 调试适配器速度
# 5000 kHz 在 RP2350 + CMSIS-DAP 上偶尔会把卡在 fault 循环的 CM0 读丢。
# 1000 kHz 是稳定保守值,确认工作后再提速。
adapter speed 1000

# RP2350 没有 SRST 线 — 复位靠 SYSRESETREQ(via cortex_m reset_config),
# 已在 target/rp2350.cfg 内默认设置。这里不需要再覆盖 reset_config。

# init 本身不会因为某个 target examine 失败就 abort(只 warn),但裸 halt
# 会 fatal。用 catch 包起来,让脚本始终进入交互态 — 卡住的 CM0 可以靠
# 后续的 rescue_reset(见 Makefile rescue 目标)或 -c 命令救回。
init
catch { halt }
